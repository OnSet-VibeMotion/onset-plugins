name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 每周把所有版本再取一遍：作者删了仓库、强推掉 commit 时尽早发现。
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # PR 另查改的是谁的登记：只有 maintainers 里的人能改、删；新登记只能登记自己（或自己所在组织）的仓库。
      - name: Validate changed versions and who changed them
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: node scripts/validate.mjs --since "origin/${{ github.base_ref }}" --pr-author "$PR_AUTHOR" --association "$ASSOCIATION"
      - name: Validate changed versions
        if: github.event_name == 'push'
        run: node scripts/validate.mjs --since "${{ github.event.before }}"
      - name: Validate every version
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/validate.mjs --all
